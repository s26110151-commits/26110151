<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朋友對我的動態留言板 // CYBER-BOARD</title>

  <!-- 引入 Google 復古/科技感字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       1. 視覺色彩與變數設定 (視覺風格參數 - 可在此修改顏色)
       ========================================================================== */
    :root {
      /* 背景色系 */
      --bg-color: #0b0c10;           /* 深邃夜空黑背景 */
      --card-bg: #12141d;            /* 卡片底色 */
      
      /* 霓虹主題色彩 */
      --primary-cyan: #00f0ff;       /* 科技青藍色 (主發光色) */
      --primary-pink: #ff007f;       /* Y2K 霓虹粉紅 (次發光色) */
      --neon-yellow: #ffe600;        /* 強調黃色 */
      
      /* 文字顏色 */
      --text-main: #f0f6fc;          /* 主要文字白 */
      --text-sub: #8b949e;           /* 次要時間文字灰 */
      
      /* 動畫參數設定 */
      --carousel-speed: 3000ms;     /* 輪播間隔時間：3000ms = 3 秒 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Noto Sans TC', sans-serif;
      min-height: 100vh;
      padding: 30px 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* 背景網格與 CRT 科技掃描線特效 */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: 
        linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 0, 127, 0.05) 1px, transparent 1px);
      background-size: 30px 30px;
      pointer-events: none;
      z-index: -1;
    }

    /* 頁面大標題區 */
    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-family: 'Orbitron', 'Noto Sans TC', sans-serif;
      font-size: 2.5rem;
      letter-spacing: 2px;
      color: #fff;
      text-transform: uppercase;
      text-shadow: 
        0 0 10px var(--primary-cyan),
        0 0 20px var(--primary-pink);
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-sub);
      font-size: 1rem;
      letter-spacing: 1px;
    }

    /* Container 容器 */
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ==========================================================================
       2. 酷炫 Loading 讀取動畫
       ========================================================================== */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 300px;
    }

    .cyber-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(0, 240, 255, 0.1);
      border-left-color: var(--primary-cyan);
      border-right-color: var(--primary-pink);
      border-radius: 50%;
      animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
      box-shadow: 0 0 15px var(--primary-cyan);
    }

    @keyframes spin {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.1); }
      100% { transform: rotate(360deg) scale(1); }
    }

    .loading-text {
      margin-top: 20px;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      color: var(--primary-cyan);
      letter-spacing: 3px;
      text-shadow: 0 0 10px var(--primary-cyan);
      animation: blink 1.2s infinite alternate;
    }

    @keyframes blink {
      0% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    /* ==========================================================================
       3. 瀑布流排版 (Masonry Layout via CSS Column)
       ========================================================================== */
    .masonry-wall {
      column-count: 3;             /* 電腦版預設 3 欄 */
      column-gap: 20px;
      width: 100%;
      display: none;               /* 載入完成前先隱藏 */
    }

    /* RWD 響應式調整欄數 */
    @media (max-width: 900px) {
      .masonry-wall { column-count: 2; } /* 平板 2 欄 */
    }
    @media (max-width: 600px) {
      .masonry-wall { column-count: 1; } /* 手機 1 欄 */
    }

    /* ==========================================================================
       4. 留言卡片樣式與輪播 Spotlight 特效
       ========================================================================== */
    .msg-card {
      break-inside: avoid;         /* 防止卡片跨欄截斷 */
      margin-bottom: 20px;
      background: var(--card-bg);
      border: 2px solid rgba(0, 240, 255, 0.2);
      border-radius: 12px;
      padding: 20px;
      position: relative;
      /* 轉場動畫平滑效果 (可修改秒數調整流暢度) */
      transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .msg-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
      padding-bottom: 8px;
    }

    .msg-author {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--primary-cyan);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .msg-author::before {
      content: "✦";
      color: var(--primary-pink);
    }

    .msg-time {
      font-size: 0.75rem;
      color: var(--text-sub);
      font-family: 'Orbitron', monospace;
    }

    .msg-content {
      font-size: 1rem;
      line-height: 1.6;
      color: var(--text-main);
      word-break: break-word;
      white-space: pre-wrap;      /* 保留原始留言的換行 */
    }

    /* --------------------------------------------------------------------------
       ✨ 輪播狀態：被焦點選中 (Highlight) 的卡片特效
       -------------------------------------------------------------------------- */
    .msg-card.highlight {
      transform: scale(1.06) z-index(10);
      border-color: var(--primary-pink);
      /* 強烈的雙色霓虹發光邊框 */
      box-shadow: 
        0 0 20px var(--primary-pink),
        inset 0 0 15px rgba(255, 0, 127, 0.3),
        0 0 40px rgba(0, 240, 255, 0.4);
      z-index: 10;
      opacity: 1 !important;
      filter: blur(0px) !important;
    }

    /* --------------------------------------------------------------------------
       陰暗狀態：未被選中的卡片 (Dimmed) 稍微變暗變模糊
       -------------------------------------------------------------------------- */
    .masonry-wall.has-highlight .msg-card:not(.highlight) {
      opacity: 0.35;                 /* 未選中調暗至 35% 透明度 (可修改) */
      filter: blur(1.5px);           /* 未選中微模糊 1.5px (可修改) */
      transform: scale(0.98);        /* 稍微縮小 */
    }

  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>MESSAGES // 動態留言板</h1>
      <p>朋友留給我的秘密與悄悄話</p>
    </header>

    <!-- 讀取中動畫 -->
    <div id="loading">
      <div class="cyber-spinner"></div>
      <div class="loading-text">CONNECTING & READING DATA...</div>
    </div>

    <!-- 瀑布流留言牆容器 -->
    <div id="wall" class="masonry-wall"></div>
  </div>

  <script>
    // ==========================================================================
    // 參數配置 (Configuration)
    // ==========================================================================
    // Google 試算表 CSV 網址
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSkxSuTAwL7ygcZ2mUENctw6xSnX7taF4c0CVAQhYzL1a14m-KeQZOSDJueIAJBMKKpioWrbKHumpzz/pub?output=csv';
    
    // 輪播變換間隔時間 (單位: 毫秒)
    const CAROUSEL_INTERVAL = 3000; // 3000ms = 3 秒 (可在這裡修改輪播速度)

    // 全局變數
    let messageCards = [];          // 存放所有生成的 DOM 卡片
    let currentIndex = 0;           // 目前高亮的卡片索引
    let carouselTimer = null;       // 計時器物件

    // ==========================================================================
    // 1. 初始化與讀取 Google 試算表 CSV 資料
    // ==========================================================================
    document.addEventListener('DOMContentLoaded', () => {
      fetchMessages();
    });

    async function fetchMessages() {
      try {
        const response = await fetch(CSV_URL);
        if (!response.ok) throw new Error('網路回應錯誤');
        
        const csvText = await response.text();
        const parsedData = parseCSV(csvText);
        
        // 渲染卡片
        renderCards(parsedData);
        
        // 隱藏 Loading、顯示留言牆
        document.getElementById('loading').style.display = 'none';
        const wall = document.getElementById('wall');
        wall.style.display = 'block';

        // 啟動 3 秒輪播焦點特效
        if (messageCards.length > 0) {
          wall.classList.add('has-highlight'); // 啟用未選中變暗樣式
          startCarousel();
        }

      } catch (error) {
        console.error('讀取 CSV 失敗:', error);
        document.getElementById('loading').innerHTML = `
          <div class="loading-text" style="color: #ff3366;">[ERROR] 資料讀取失敗，請稍後再試。</div>
        `;
      }
    }

    // ==========================================================================
    // 2. CSV 安全解析函式 (精確處理內容中的引號、逗號與換行)
    // ==========================================================================
    function parseCSV(text) {
      const rows = [];
      let currentRow = [];
      let currentCell = '';
      let insideQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (insideQuotes && nextChar === '"') {
            currentCell += '"';
            i++; // 跳過轉義的雙引號
          } else {
            insideQuotes = !insideQuotes; // 切換引號狀態
          }
        } else if (char === ',' && !insideQuotes) {
          currentRow.push(currentCell.trim());
          currentCell = '';
        } else if ((char === '\r' || char === '\n') && !insideQuotes) {
          if (char === '\r' && nextChar === '\n') {
            i++; // 處理 CRLF (\r\n)
          }
          currentRow.push(currentCell.trim());
          if (currentRow.some(cell => cell.length > 0)) {
            rows.push(currentRow);
          }
          currentRow = [];
          currentCell = '';
        } else {
          currentCell += char;
        }
      }

      if (currentCell.length > 0 || currentRow.length > 0) {
        currentRow.push(currentCell.trim());
        rows.push(currentRow);
      }

      // 跳過第 1 列 (標題列)，將後續資料轉成物件陣列
      // 預設欄位順序：[0] 時間戳記, [1] 名字, [2] 悄悄話
      const data = rows.slice(1).map(row => {
        return {
          timestamp: row[0] || '',
          name: row[1] || '無名氏',
          content: row[2] || ''
        };
      }).filter(item => item.content !== ''); // 過濾空留言

      return data;
    }

    // ==========================================================================
    // 3. 動態渲染 DOM 卡片
    // ==========================================================================
    function renderCards(data) {
      const wall = document.getElementById('wall');
      wall.innerHTML = '';
      messageCards = [];

      data.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'msg-card';
        card.setAttribute('data-index', index);

        // 格式化時間 (簡單擷取日期部分)
        const formattedTime = item.timestamp.split(' ')[0] || item.timestamp;

        card.innerHTML = `
          <div class="msg-header">
            <span class="msg-author">${escapeHTML(item.name)}</span>
            <span class="msg-time">${escapeHTML(formattedTime)}</span>
          </div>
          <div class="msg-content">${escapeHTML(item.content)}</div>
        `;

        // 點擊卡片時可手動切換焦點
        card.addEventListener('click', () => {
          setHighlight(index);
          resetTimer();
        });

        wall.appendChild(card);
        messageCards.push(card);
      });
    }

    // 防止 XSS 攻擊的字元轉義函式
    function escapeHTML(str) {
      return str.replace(/[&<>"']/g, match => {
        const escapeMap = {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        };
        return escapeMap[match];
      });
    }

    // ==========================================================================
    // 4. 隨時間自動輪播高亮特效 (Spotlight Highlight Timer)
    // ==========================================================================
    function setHighlight(index) {
      if (messageCards.length === 0) return;

      // 移除上一次的高亮
      messageCards.forEach(card => card.classList.remove('highlight'));

      // 加上當前的高亮卡片
      currentIndex = index % messageCards.length;
      const targetCard = messageCards[currentIndex];
      targetCard.classList.add('highlight');
    }

    function startCarousel() {
      // 預設第 1 張卡片高亮
      setHighlight(0);

      // 每隔設定時間 (預設 3000ms) 切換下一張
      carouselTimer = setInterval(() => {
        currentIndex = (currentIndex + 1) % messageCards.length;
        setHighlight(currentIndex);
      }, CAROUSEL_INTERVAL);
    }

    function resetTimer() {
      // 手動點擊卡片時，重置計時器避免快速切換
      clearInterval(carouselTimer);
      carouselTimer = setInterval(() => {
        currentIndex = (currentIndex + 1) % messageCards.length;
        setHighlight(currentIndex);
      }, CAROUSEL_INTERVAL);
    }
  </script>
</body>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Y2K PORTFOLIO HUB // 作品集闖關地圖</title>
  <!-- Google Fonts: VT323 復古像素字體與 Press Start 2P -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================
       Y2K 核心色彩與變數設定
       ========================================== */
    :root {
      --bg-color: #0d0221;
      --y2k-pink: #ff007f;
      --y2k-cyan: #00f0ff;
      --y2k-lime: #39ff14;
      --y2k-yellow: #fff000;
      --y2k-purple: #7b2cbf;
      --y2k-dark-card: #180a29;
      --metal-grad: linear-gradient(135deg, #e0e0e0 0%, #ffffff 40%, #8a8a8a 50%, #b0b0b0 100%);
      --btn-grad: linear-gradient(180deg, #ff66cc 0%, #ff007f 100%);
      --btn-cyan-grad: linear-gradient(180deg, #80ffff 0%, #00b3cc 100%);
      --locked-grad: linear-gradient(180deg, #4a4a5a 0%, #2a2a35 100%);
      --border-outer: #ff007f;
      --text-glow: 0 0 10px rgba(255, 0, 127, 0.8), 0 0 20px rgba(0, 240, 255, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: #fff;
      font-family: 'VT323', 'Noto Sans TC', monospace, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* 網格背景 + CRT 掃描線效果 */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: 
        linear-gradient(rgba(0, 240, 255, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 0, 127, 0.08) 1px, transparent 1px);
      background-size: 30px 30px;
      z-index: -2;
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.25) 50%
      );
      background-size: 100% 4px;
      z-index: 999;
      pointer-events: none;
      opacity: 0.6;
    }

    /* ==========================================
       Y2K 視窗主容器
       ========================================== */
    .y2k-window {
      width: 100%;
      max-width: 900px;
      background: var(--y2k-dark-card);
      border: 4px solid var(--y2k-cyan);
      box-shadow: 
        0 0 15px var(--y2k-pink),
        inset 0 0 15px rgba(0, 240, 255, 0.3),
        8px 8px 0px #000;
      border-radius: 8px;
      padding: 6px;
      position: relative;
      animation: windowGlow 4s infinite alternate;
    }

    @keyframes windowGlow {
      0% { box-shadow: 0 0 15px var(--y2k-pink), 8px 8px 0px #000; }
      100% { box-shadow: 0 0 25px var(--y2k-cyan), 8px 8px 0px #000; }
    }

    /* 視窗標題列 */
    .window-header {
      background: linear-gradient(90deg, var(--y2k-pink), var(--y2k-purple), var(--y2k-cyan));
      padding: 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 4px 4px 0 0;
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      letter-spacing: 1px;
      color: #fff;
      text-shadow: 2px 2px #000;
      margin-bottom: 20px;
    }

    .window-controls {
      display: flex;
      gap: 6px;
    }

    .win-btn {
      width: 16px;
      height: 16px;
      background: var(--metal-grad);
      border: 1px solid #000;
      box-shadow: inset 1px 1px #fff, inset -1px -1px #555;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }

    /* ==========================================
       個人檔案資料區 (Profile Section)
       ========================================== */
    .profile-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 25px;
      padding: 0 15px;
    }

    .avatar-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      margin-bottom: 15px;
    }

    /* 閃光邊框與旋轉金屬圈 */
    .avatar-wrapper::before {
      content: '';
      position: absolute;
      top: -8px; left: -8px; right: -8px; bottom: -8px;
      border: 3px dashed var(--y2k-yellow);
      border-radius: 50%;
      animation: rotateRing 12s linear infinite;
    }

    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid #fff;
      box-shadow: 0 0 15px var(--y2k-cyan);
      background: #000;
    }

    .user-name {
      font-family: 'Press Start 2P', cursive;
      font-size: 1.5rem;
      color: #fff;
      text-shadow: var(--text-glow);
      margin-bottom: 8px;
      letter-spacing: 2px;
    }

    .user-status {
      display: inline-block;
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid var(--y2k-cyan);
      color: var(--y2k-lime);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 1.1rem;
      letter-spacing: 1px;
    }

    .user-status span {
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* ==========================================
       16個關卡選單網格 (Grid Layout)
       ========================================== */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr); /* 電腦版 4x4 */
      gap: 15px;
      padding: 10px;
    }

    /* 通用按鈕基底 */
    .quest-btn {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 85px;
      padding: 10px;
      text-decoration: none;
      border-radius: 8px;
      font-family: 'Noto Sans TC', sans-serif;
      font-weight: 700;
      text-align: center;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      outline: none;
    }

    /* 數字編號標籤 */
    .quest-num {
      position: absolute;
      top: 4px;
      left: 8px;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.65rem;
      opacity: 0.8;
    }

    /* --- 已解鎖按鈕 (Unlocked Buttons) --- */
    .quest-btn.unlocked {
      background: var(--btn-grad);
      border: 2px solid #fff;
      color: #fff;
      box-shadow: 
        inset 0 2px 0 rgba(255,255,255,0.6),
        3px 3px 0px #000,
        0 0 10px rgba(255, 0, 127, 0.5);
      cursor: pointer;
    }

    .quest-btn.unlocked:nth-child(2) {
      background: var(--btn-cyan-grad);
      box-shadow: 
        inset 0 2px 0 rgba(255,255,255,0.6),
        3px 3px 0px #000,
        0 0 10px rgba(0, 240, 255, 0.5);
      color: #002b36;
    }

    .quest-btn.unlocked .quest-title {
      font-size: 1rem;
      line-height: 1.3;
      margin-top: 8px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }

    .quest-btn.unlocked:nth-child(2) .quest-title {
      text-shadow: none;
    }

    /* ✨ 酷炫 Hover 動畫效果 ✨ */
    .quest-btn.unlocked:hover {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 
        0 0 20px var(--y2k-yellow),
        5px 5px 0px #000;
      border-color: var(--y2k-yellow);
      animation: glitch 0.3s infinite alternate;
    }

    .quest-btn.unlocked:active {
      transform: translateY(2px) scale(0.98);
      box-shadow: 1px 1px 0px #000;
    }

    /* Glitch 震動微效果 */
    @keyframes glitch {
      0% { transform: translateY(-4px) scale(1.05) skew(0deg); }
      50% { transform: translateY(-4px) scale(1.05) skew(1deg); }
      100% { transform: translateY(-4px) scale(1.05) skew(-1deg); }
    }

    /* --- 未解鎖按鈕 (Locked Buttons) --- */
    .quest-btn.locked {
      background: var(--locked-grad);
      border: 2px solid #3a3a4c;
      color: #71718a;
      cursor: not-allowed;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
      pointer-events: none; /* 禁止點擊 */
    }

    .quest-btn.locked .lock-icon {
      font-size: 1.2rem;
      margin-bottom: 2px;
      filter: grayscale(100%);
      opacity: 0.6;
    }

    .quest-btn.locked .quest-title {
      font-size: 0.85rem;
      font-family: 'VT323', monospace;
      letter-spacing: 1px;
    }

    /* ==========================================
       響應式適配 (RWD 調整)
       ========================================== */
    /* 平板螢幕 (約 768px 以下) */
    @media (max-width: 768px) {
      .menu-grid {
        grid-template-columns: repeat(2, 1fr); /* 改為 2 欄 */
        gap: 12px;
      }
      .user-name {
        font-size: 1.2rem;
      }
    }

    /* 手機螢幕 (約 480px 以下) */
    @media (max-width: 480px) {
      body {
        padding: 10px;
      }
      .window-header {
        font-size: 9px;
      }
      .menu-grid {
        grid-template-columns: repeat(2, 1fr); /* 保持 2 欄方便對齊，按鈕縮小 */
        gap: 8px;
      }
      .quest-btn {
        min-height: 75px;
        padding: 6px;
      }
      .quest-btn.unlocked .quest-title {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Y2K PORTFOLIO HUB // 作品集闖關地圖</title>
  <!-- Google Fonts: VT323 復古像素字體與 Press Start 2P -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================
       Y2K 核心色彩與變數設定
       ========================================== */
    :root {
      --bg-color: #0d0221;
      --y2k-pink: #ff007f;
      --y2k-cyan: #00f0ff;
      --y2k-lime: #39ff14;
      --y2k-yellow: #fff000;
      --y2k-purple: #7b2cbf;
      --y2k-dark-card: #180a29;
      --metal-grad: linear-gradient(135deg, #e0e0e0 0%, #ffffff 40%, #8a8a8a 50%, #b0b0b0 100%);
      --btn-grad: linear-gradient(180deg, #ff66cc 0%, #ff007f 100%);
      --btn-cyan-grad: linear-gradient(180deg, #80ffff 0%, #00b3cc 100%);
      --btn-lime-grad: linear-gradient(180deg, #b3ff80 0%, #28cc00 100%);
      --locked-grad: linear-gradient(180deg, #4a4a5a 0%, #2a2a35 100%);
      --border-outer: #ff007f;
      --text-glow: 0 0 10px rgba(255, 0, 127, 0.8), 0 0 20px rgba(0, 240, 255, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: #fff;
      font-family: 'VT323', 'Noto Sans TC', monospace, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* 網格背景 + CRT 掃描線效果 */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: 
        linear-gradient(rgba(0, 240, 255, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 0, 127, 0.08) 1px, transparent 1px);
      background-size: 30px 30px;
      z-index: -2;
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.25) 50%
      );
      background-size: 100% 4px;
      z-index: 999;
      pointer-events: none;
      opacity: 0.6;
    }

    /* ==========================================
       Y2K 視窗主容器
       ========================================== */
    .y2k-window {
      width: 100%;
      max-width: 900px;
      background: var(--y2k-dark-card);
      border: 4px solid var(--y2k-cyan);
      box-shadow: 
        0 0 15px var(--y2k-pink),
        inset 0 0 15px rgba(0, 240, 255, 0.3),
        8px 8px 0px #000;
      border-radius: 8px;
      padding: 6px;
      position: relative;
      animation: windowGlow 4s infinite alternate;
    }

    @keyframes windowGlow {
      0% { box-shadow: 0 0 15px var(--y2k-pink), 8px 8px 0px #000; }
      100% { box-shadow: 0 0 25px var(--y2k-cyan), 8px 8px 0px #000; }
    }

    /* 視窗標題列 */
    .window-header {
      background: linear-gradient(90deg, var(--y2k-pink), var(--y2k-purple), var(--y2k-cyan));
      padding: 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 4px 4px 0 0;
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      letter-spacing: 1px;
      color: #fff;
      text-shadow: 2px 2px #000;
      margin-bottom: 20px;
    }
